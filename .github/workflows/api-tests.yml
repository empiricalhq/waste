name: API Tests

on:
  push:
    branches:
      - 'master'
    paths:
      - 'apps/api/**'
  pull_request:
    branches:
      - 'master'
    paths:
      - 'apps/api/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: testing

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v5

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - run: bun install --filter @lima-garbage/api

      - run: bun run test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
